name: Validate

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [production]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test website
        run: npm run test:website

      - name: Test subtitles
        run: npm run test:subtitle

      - name: Build application
        run: npm run build

  check-website-deployment:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.head_commit.modified, 'live-website/') ||
      contains(github.event.head_commit.added, 'live-website/') ||
      github.event_name == 'pull_request'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for Cloudflare deployment
        run: sleep 30

      - name: Test Cloudflare website health
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://luffy-create.pages.dev/)
          echo "Website status code: $response"
          if [ "$response" != "200" ]; then
            echo "Website is not responding with 200 OK"
            exit 1
          fi
          echo "Website is healthy!"

      - name: Test website accessibility
        run: |
          curl -s https://luffy-create.pages.dev/ | grep -q "<html\|<!doctype" && echo "HTML content found" || exit 1

      - name: Run additional health checks (optional)
        run: |
          # Check for specific pages or endpoints
          curl -s -f https://luffy-create.pages.dev/ > /dev/null && echo "Home page loaded successfully"