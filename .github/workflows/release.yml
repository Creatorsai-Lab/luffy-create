name: Build & Release

# Triggers when you push a version tag like v1.3.0
on:
  push:
    tags:
      - 'v*'

# Allow the workflow to upload built installers to the GitHub Release
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Linux needs these libs for Electron to build an AppImage  
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenjp2-tools rpm fakeroot dpkg pkg-config libcairo2-dev libpango1.0-dev cmake

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main (electron-vite)
        run: npm run build

      - name: Prepare bundled Python Sandbox
        run: npm run prepare-python-sandbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare local Whisper captions engine
        run: npm run prepare-local-whisper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package — Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment and add secrets when you have a code-signing cert:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Package — macOS
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Skip code signing so the build succeeds without Apple certs.
          # Users will need to right-click → Open on first launch.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package — Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
